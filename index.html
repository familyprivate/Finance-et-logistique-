<!DOCTYPE html>
<html lang="fr" class="sk sk-retro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indivision</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Indivision">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6E7C8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Outfit:wght@400;600;700;800&family=Shrikhand&display=swap" rel="stylesheet">
<style>
/* Plan : registre de notaire moderne. Vert cadastre en accent, bleu ardoise = bien locatif, ocre = maison secondaire.
   Layout : barre d'onglets fixe en haut, une vue par onglet, tuiles de synthèse puis détail. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#F7F8F6; --ink:#1A231F; --muted:#5D6A64; --line:#DCE2DE;
  --accent:#2C5E4D; --accent-ink:#FFFFFF; --accent-soft:#E2ECE7;
  --loc:#3A5A8C; --loc-soft:#E4EAF4; --sec:#A0661C; --sec-soft:#F5EBDD; --com:#6B6F7A; --com-soft:#ECEDEF;
  --good:#2D7A4C; --good-soft:#E1F0E6; --warn:#A86E12; --warn-soft:#FAEFD9; --bad:#B0412C; --bad-soft:#F8E3DE;
  --font-display:"Newsreader", Georgia, "Times New Roman", serif;
  --font-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,25,.06), 0 4px 14px rgba(20,30,25,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#18201C; --surface-2:#1D2622; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2A3530;
    --accent:#72B69C; --accent-ink:#0F1A15; --accent-soft:#1E2F28;
    --loc:#86A8DE; --loc-soft:#1E2838; --sec:#DDA65C; --sec-soft:#33281A; --com:#A9ADB8; --com-soft:#262A30;
    --good:#62C38E; --good-soft:#18301F; --warn:#E2B458; --warn-soft:#33290F; --bad:#E8806A; --bad-soft:#3A1E18;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201C; --surface-2:#1D2622; --ink:#E6ECE8; --muted:#9AA8A1; --line:#2A3530;
  --accent:#72B69C; --accent-ink:#0F1A15; --accent-soft:#1E2F28;
  --loc:#86A8DE; --loc-soft:#1E2838; --sec:#DDA65C; --sec-soft:#33281A; --com:#A9ADB8; --com-soft:#262A30;
  --good:#62C38E; --good-soft:#18301F; --warn:#E2B458; --warn-soft:#33290F; --bad:#E8806A; --bad-soft:#3A1E18;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,td.amt,.tile .v{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.45rem}
h2{font-size:1.3rem}
h3{font-size:1.05rem;font-family:var(--font-body);font-weight:600;letter-spacing:0}
.muted{color:var(--muted)}
small{color:var(--muted)}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1180px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand-l{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand-l .kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.spaces{display:inline-flex;gap:2px;padding:3px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.spaces a{padding:5px 12px;border-radius:99px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.85rem;white-space:nowrap}
.spaces a[aria-current]{background:var(--accent);color:var(--accent-ink)}
body.maison{--accent:var(--sec);--accent-soft:var(--sec-soft)}
body.locatif{--accent:var(--loc);--accent-soft:var(--loc-soft)}
body.solo nav.tabs,body.solo .bnav{display:none!important}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.good::before{background:var(--good)} .status.warn::before{background:var(--warn)} .status.bad::before{background:var(--bad)}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:20px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g-main,.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.g4{grid-template-columns:minmax(0,1fr)}}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:.8rem;color:var(--muted);font-weight:500}
.tile .v{font-size:1.55rem;font-weight:600;letter-spacing:-.01em}
.tile .s{font-size:.8rem;color:var(--muted)}
.tile.hero{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tile.hero .k,.tile.hero .s{color:inherit;opacity:.82}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* Buttons */
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.3}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:5px 8px}
button.ghost:hover{color:var(--ink);background:var(--surface-2)}
button.danger{color:var(--bad)}
button.sm{padding:4px 9px;font-size:.85rem}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.readonly .w{display:none !important}

/* Forms */
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters .field{flex:1 1 150px;max-width:240px}
.filters .field.grow{max-width:none;flex:2 1 220px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field.check{flex-direction:row;align-items:center;gap:8px}
.field.check input{width:auto}
.field.check label{font-size:.92rem;color:var(--ink);font-weight:500}
.req{color:var(--bad)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .field{grid-column:1 / -1}
.form-grid .field.half{grid-column:auto}
@media (max-width:520px){.form-grid .field.half{grid-column:1 / -1}}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.loc{background:var(--loc-soft);color:var(--loc);border-color:transparent}
.chip.sec{background:var(--sec-soft);color:var(--sec);border-color:transparent}
.chip.com{background:var(--com-soft);color:var(--com);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

/* Tables */
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.amt,th.amt{text-align:right;white-space:nowrap;font-weight:600}
td.date{white-space:nowrap;color:var(--muted)}
td.act{white-space:nowrap;text-align:right}
td .sub{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
tfoot td{font-weight:600;border-top:2px solid var(--line)}
tr.prev td{color:var(--muted);font-style:italic}
tr.subrow td{background:var(--surface-2);font-size:.88rem;padding-top:6px;padding-bottom:6px}
tr.prev td.amt{opacity:.75}
table.ops td{vertical-align:middle}
table.ops td.lib{max-width:300px}
table.ops td.act .ghost{padding:4px 6px}
table.ops .one{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.ops td.date,table.ops td.cat,table.ops td.bien{white-space:nowrap}
tr.msep td{padding:9px 12px;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tr.msep + tr td{border-top:0}
.mlab{font-weight:700;text-transform:capitalize;color:var(--accent);font-size:.92rem}
.mres{font-size:.85rem;font-weight:600;margin-left:4px}
.mfin{float:right;color:var(--ink);font-weight:500;font-size:.85rem}
tr.today td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);background:transparent}
.tpill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--accent);border-radius:99px;padding:5px 14px;font-size:.86rem;color:var(--ink);background:var(--surface)}
.tpill>strong:first-of-type{color:var(--accent)}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tsep{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
tr.annuel td{padding-top:6px;padding-bottom:6px}
tr.anl{--lis:color-mix(in srgb, var(--muted) 45%, transparent)}
tr.anl td{border-bottom-color:transparent}
tr.anl td:first-child{border-left:1px solid var(--lis)}
tr.anl td:last-child{border-right:1px solid var(--lis)}
tr.anl.anl-first td{border-top:1px solid var(--lis)}
tr.anl.anl-last td{border-bottom:1px solid var(--lis)}
select.annuel-sel{width:auto;max-width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);font-style:inherit;font-size:.88rem;padding:4px 8px}
tr.prev select.annuel-sel{font-style:italic}
/* en-têtes de colonnes collants */
table.ops thead th{position:sticky;top:var(--hdr,0px);z-index:5;background:var(--accent);color:var(--accent-ink);font-size:.78rem;font-weight:700;letter-spacing:.07em;padding:11px 8px;border-bottom:0}
table.ops thead th:first-child{border-radius:10px 0 0 10px;padding-left:12px}
table.ops thead th:last-child{border-radius:0 10px 10px 0}
table.ops thead tr{box-shadow:0 6px 8px -6px rgba(0,0,0,.25)}
table.ops thead + tbody tr:first-child td{border-top:0}
.card .table-wrap:has(table.ops){overflow:visible}
/* actions discrètes */
table.ops td.act .ghost{font-size:.74rem;color:var(--muted);opacity:.55;padding:2px 5px}
table.ops td.act .ghost.danger{color:var(--muted)}
table.ops tr.op:hover td.act .ghost,table.ops td.act .ghost:focus-visible{opacity:1}
table.ops td.act .ghost.danger:hover{color:var(--bad)}
@media (min-width:641px) and (max-width:1000px){ table.ops thead th:nth-child(3),table.ops td.cat{display:none} table.ops td.lib{max-width:240px} table.ops .th-btn{font-size:0;padding:4px 10px} table.ops .th-btn::before{content:"+ Ajouter";font-size:.8rem} table.ops td.act{white-space:nowrap} table.ops td.act .ghost[data-a=edit-op],table.ops td.act .ghost[data-a=dup-op]{font-size:0!important;padding:8px 9px!important} table.ops td.act .ghost[data-a=edit-op]::before{content:"✎";font-size:1rem} table.ops td.act .ghost[data-a=dup-op]::before{content:"⧉";font-size:1rem} table.ops td.date{font-size:.85rem} }
@media (hover:none){ table.ops td.act .ghost{opacity:.9;padding:8px 9px;min-height:34px} }
.info-btn{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;color:var(--muted);font:italic 700 11px Georgia,serif;padding:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:4px;cursor:pointer}
.info-btn:hover,.info-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.pop{position:absolute;left:8px;top:calc(100% - 4px);z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 12px;min-width:300px;max-width:calc(100vw - 40px);font-style:normal;color:var(--ink);white-space:normal}
.pop-t{font-weight:700;font-size:.82rem;margin-bottom:6px;color:var(--muted)}
.pop-r{display:flex;justify-content:space-between;gap:20px;font-size:.86rem;padding:3px 0}
.pop-tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:700}
.pop{min-width:420px}
.pop-r{align-items:center}
.pop-a{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.amt-btn{border:0;background:transparent;padding:2px 4px;font-weight:600;border-radius:6px;font-variant-numeric:tabular-nums;cursor:pointer;border-bottom:1px dashed transparent}
.amt-btn:hover{background:var(--surface-2);border-bottom-color:var(--muted)}
.amt-btn.pos{color:var(--good)}.amt-btn.neg{color:var(--bad)}
.pop-link{border:0;background:transparent;color:var(--muted);font-size:.75rem;padding:2px 4px;cursor:pointer}
.pop-link:hover{color:var(--ink)}
.pop-in{display:inline-flex;align-items:center;gap:4px}
.pop-in input{width:84px;text-align:right;padding:3px 6px;font-size:.86rem}
.pop-an{margin-top:6px;padding:4px 8px;border:1px solid color-mix(in srgb, var(--muted) 45%, transparent);border-radius:8px}
.pop-an .annuel-sel{margin:4px 0}
.done-mark{font-size:.8rem;color:var(--good);font-weight:600;white-space:nowrap}
.toast{display:flex;align-items:center}
.chip.prev{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-style:normal}
svg.chart .line.proj{stroke-dasharray:5 4;opacity:.8}
svg.chart .area.proj{opacity:.05}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress>div{height:100%;background:var(--accent);width:0}

/* Lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:600}
.item .meta{font-size:.82rem;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:3px}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--line);flex:none}
.stripe.Urgente{background:var(--bad)} .stripe.Haute{background:var(--warn)} .stripe.Normale{background:var(--accent)} .stripe.Basse{background:var(--line)}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* Bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(90px,160px) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;border-radius:99px;background:var(--accent)}
.bar-fill.loc{background:var(--loc)} .bar-fill.sec{background:var(--sec)} .bar-fill.com{background:var(--com)}

/* Loyers grid */
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:620px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}}
.month{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface);text-align:left;font-weight:400}
.month .m{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.month .a{font-weight:600;font-variant-numeric:tabular-nums}
.month.ok{background:var(--good-soft);border-color:transparent} .month.ok .a{color:var(--good)}
.month.missing{background:var(--bad-soft);border-color:transparent} .month.missing .a{color:var(--bad)}
.month.due{background:var(--warn-soft);border-color:transparent} .month.due .a{color:var(--warn)}
.month.future,.month.off{opacity:.6}
input.jour-ag{background:var(--loc-soft);border-color:transparent}
button.month{cursor:pointer}

dl.facts{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 16px;margin:0;font-size:.92rem}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;font-weight:500;white-space:pre-wrap;overflow-wrap:anywhere}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;background:var(--surface-2);font-size:.9rem;text-decoration:none;color:var(--ink)}
.alert.bad{background:var(--bad-soft)} .alert.warn{background:var(--warn-soft)} .alert.info{background:var(--loc-soft)}
.alert .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.alert.bad .dot{background:var(--bad)} .alert.warn .dot{background:var(--warn)} .alert.info .dot{background:var(--loc)}

.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

details.notice{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
details.notice summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none}
details.notice summary::-webkit-details-marker{display:none}
details.notice .body{margin-top:10px;white-space:pre-wrap;font-size:.92rem;overflow-wrap:anywhere}

svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--font-body);font-size:11px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
svg.chart .line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
svg.chart .area{fill:var(--accent);opacity:.12}
svg.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
svg.chart .end{fill:var(--ink);font-weight:600;font-size:12px}

/* Modal */

<script>
/* ===== Connexion Google Sheets (Apps Script) : remplace le stockage claude.ai ===== */
(function(){
  const LS="indiv-gas";
  let conf=null; try{ conf=JSON.parse(localStorage.getItem(LS)||"null"); }catch(e){}
  window.GAS={ get conf(){ return conf; }, save(c){ conf=c; try{ localStorage.setItem(LS,JSON.stringify(c)); }catch(e){} }, clear(){ conf=null; try{ localStorage.removeItem(LS); }catch(e){} } };
  if(!conf||!conf.url) return;
  const store={}, docL={}, colL={}, errL=[]; let loaded=false, queue=[], waiters=[], flushT=null, busy=false;
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const snapCol=c=>{ const m=store[c]||{}; const docs=Object.keys(m).map(id=>({id,exists:true,data:()=>clone(m[id])})); return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}}; };
  const snapDoc=(c,id)=>{ const d=(store[c]||{})[id]; return {id,exists:!!d,data:()=>clone(d),metadata:{fromCache:false}}; };
  const emitCol=c=>(colL[c]||[]).forEach(f=>{ try{ f(snapCol(c)); }catch(e){ console.warn(e); } });
  const emitDoc=(c,id)=>(docL[c+"/"+id]||[]).forEach(f=>{ try{ f(snapDoc(c,id)); }catch(e){ console.warn(e); } });
  const emitAll=c=>{ emitCol(c); Object.keys(docL).forEach(k=>{ if(k.startsWith(c+"/")) emitDoc(c,k.slice(c.length+1)); }); };
  function applyLocal(op){ const m=store[op.col]||(store[op.col]={}); if(op.op==="set") m[op.id]=clone(op.data); else if(op.op==="update") m[op.id]=Object.assign(m[op.id]||{},clone(op.data)); else delete m[op.id]; }
  async function post(body){
    let r; try{ r=await fetch(conf.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:conf.key,...body})}); }
    catch(e){ throw Object.assign(new Error("Réseau indisponible"),{code:"unavailable"}); }
    let j; try{ j=await r.json(); }catch(e){ throw Object.assign(new Error("Réponse illisible du script"),{code:"server"}); }
    if(!j.ok) throw Object.assign(new Error(j.error||"Erreur"),{code:j.code==="denied"?"permission-denied":"server"}); return j;
  }
  async function load(){
    let r; try{ r=await fetch(conf.url+"?key="+encodeURIComponent(conf.key)+"&t="+Date.now()); }catch(e){ throw Object.assign(new Error("Réseau indisponible"),{code:"unavailable"}); }
    const j=await r.json(); if(!j.ok) throw Object.assign(new Error(j.error||"Erreur"),{code:j.code==="denied"?"permission-denied":"server"}); return j.data||{};
  }
  const labelOf=(c,d)=>{ if(!d) return ""; if(c==="operations") return `${String(d.libelle||"").split(" – ")[0]} · ${(d.sens==="in"?"+":"−")}${(+d.montant||0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})} € · ${String(d.date||"").split("-").reverse().join("/")}`; if(c==="config") return "Paramètres"; return d.titre||d.nom||d.equipement||d.libelle||""; };
  const COLN={operations:"Opération",travaux:"Petits travaux",entretiens:"Entretien",notices:"Notice",sorties:"Adresse",config:"Paramètres"};
  function journalFor(ops){
    let cw=""; try{ cw=sessionStorage.getItem("indiv-who")||""; }catch(e){} const who=cw||conf.name||"", at=new Date().toISOString(), out=[]; const rnd=()=>Math.random().toString(36).slice(2,6);
    const real=ops.filter(o=>o.col!=="journal"&&!o.nolog);
    const del=real.filter(o=>o.op==="delete"), oth=real.filter(o=>o.op!=="delete");
    for(const o of del) out.push({act:"delete",col:o.col,id:o.id,label:labelOf(o.col,o._before),before:o._before||null});
    if(oth.length>6){ const n=oth.filter(o=>o.col==="operations").length; out.push({act:"bulk",col:"operations",label:`${oth.length} modifications groupées${n?` (dont ${n} opérations)`:""}`}); }
    else for(const o of oth) out.push({act:o._existed?"update":"create",col:o.col,id:o.id,label:labelOf(o.col,(store[o.col]||{})[o.id]||o.data)});
    return out.map((e,i)=>({op:"set",col:"journal",id:"j"+Date.now().toString(36)+rnd()+i,data:{...e,at,who,kind:COLN[e.col]||e.col}}));
  }
  function write(op){ const prev=(store[op.col]||{})[op.id]; op._existed=!!prev; if(op.op==="delete") op._before=clone(prev); applyLocal(op); emitCol(op.col); emitDoc(op.col,op.id);
    return new Promise((res,rej)=>{ queue.push(op); waiters.push({res,rej}); clearTimeout(flushT); flushT=setTimeout(flush,queue.length>50?50:300); }); }
  async function flush(){
    if(busy){ clearTimeout(flushT); flushT=setTimeout(flush,300); return; } if(!queue.length) return;
    const ops=queue.splice(0,400), ws=waiters.splice(0,ops.length); busy=true; window.GAS.pending=true;
    let jr=[]; try{ jr=journalFor(ops); jr.forEach(applyLocal); const J=Object.entries(store.journal||{}).sort((a,b)=>(a[1].at||"").localeCompare(b[1].at||"")); if(J.length>350) J.slice(0,J.length-300).forEach(([id])=>{ jr.push({op:"delete",col:"journal",id}); delete store.journal[id]; }); if(jr.length) emitCol("journal"); }catch(e){ console.warn(e); }
    const send=ops.map(({_before,_existed,nolog,...o})=>o).concat(jr);
    try{ await post({action:"write",ops:send}); ws.forEach(w=>w.res()); }catch(e){ ws.forEach(w=>w.rej(e)); }
    finally{ busy=false; window.GAS.pending=!!queue.length; if(queue.length) flush(); }
  }
  async function refresh(){
    if(queue.length||busy) return;
    try{ const d=await load(); if(queue.length||busy) return;
      const cols=new Set([...Object.keys(store),...Object.keys(d),...Object.keys(colL),...Object.keys(docL).map(k=>k.split("/")[0])]);
      for(const c of cols){ const nv=d[c]||{}; const ch=JSON.stringify(store[c]||{})!==JSON.stringify(nv); store[c]=nv; if(ch||!loaded) emitAll(c); }
      loaded=true;
    }catch(e){ errL.forEach(f=>{ try{ f(e); }catch(x){} }); }
  }
  const docRef=(c,id)=>({ id,
    set:d=>write({op:"set",col:c,id,data:d}), update:d=>write({op:"update",col:c,id,data:d}), delete:()=>write({op:"delete",col:c,id}),
    get:async()=>snapDoc(c,id),
    onSnapshot(cb,err){ (docL[c+"/"+id]=docL[c+"/"+id]||[]).push(cb); if(err) errL.push(err); if(loaded) cb(snapDoc(c,id)); return ()=>{}; } });
  const db={
    collection:c=>({ doc:id=>docRef(c,id),
      add:d=>{ const id="a"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); return write({op:"set",col:c,id,data:d}).then(()=>({id})); },
      onSnapshot(cb,err){ (colL[c]=colL[c]||[]).push(cb); if(err) errL.push(err); if(loaded) cb(snapCol(c)); return ()=>{}; } }),
    doc:p=>{ const [c,id]=p.split("/"); return docRef(c,id); }
  };
  const toB64=blob=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); });
  const assets={
    async upload(blob){ const j=await post({action:"upload",name:blob.name||"photo.jpg",mime:blob.type||"image/jpeg",b64:await toB64(blob)}); return {id:j.id,url:"https://drive.google.com/thumbnail?id="+j.id+"&sz=w2000"}; },
    async delete(id){ await post({action:"deletefile",id}); }
  };
  const user={ can:async()=>true };
  window.GAS.bulk=ops=>{ const cols=new Set(); const ps=ops.map(op=>{ op.nolog=true; applyLocal(op); cols.add(op.col); return new Promise((res,rej)=>{ queue.push(op); waiters.push({res,rej}); }); }); cols.forEach(emitAll); clearTimeout(flushT); flushT=setTimeout(flush,50); return Promise.all(ps); };
  window.GAS.refresh=refresh;
  window.claude={ use:async n=>n==="db"?db:n==="user"?user:n==="assets"?assets:null };
  refresh(); setInterval(()=>{ if(document.visibilityState==="visible") refresh(); },30000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh(); });
  window.addEventListener("beforeunload",e=>{ if(queue.length||busy){ e.preventDefault(); e.returnValue=""; } });
})();
</script>
<script>
"use strict";
/* ---------- Constantes ---------- */
const CATS = {
  in: ["Loyer","Charges récupérées","Apport indivisaire","Remboursement / indemnité","Autre recette"],
  out: ["Crédit immobilier","Taxe foncière","Assurance","Charges de copropriété","Eau / électricité / gaz","Internet / abonnements","Travaux & entretien","Frais de gestion / agence","Frais bancaires","Impôts","Autre dépense"]
};
const sensOf = c => CATS.in.includes(c) ? "in" : "out";
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const MOIS_L = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const PRIOS = ["Urgente","Haute","Normale","Basse"];
const STATUTS = ["À faire","En cours","Fait"];
const ROUTES = ["tableau","tresorerie","locatif","parametres","maison","maison-taches","maison-guide","maison-sorties"];

  ["Ramonage cheminée / poêle",12],["Entretien chaudière ou pompe à chaleur",12],["Test des détecteurs de fumée",6],
  ["Nettoyage des gouttières",12],["Contrôle du chauffe-eau / groupe de sécurité",12],["Nettoyage VMC et bouches d'aération",6],
  ["Vidange / contrôle de la fosse septique",48],["Hivernage : purge des robinets extérieurs",12],["Contrôle de la toiture",24],["Débroussaillage du terrain",12]
];
const DEFAULT_CONFIG = {nom:"Notre indivision",indivisaires:[],soldeInitial:0,dateSoldeInitial:"",
  biens:{locatif:{nom:"Bien locatif"},secondaire:{nom:"Maison secondaire"}}};

/* ---------- État ---------- */
const S = {db:null, config:null, ops:[], travaux:[], entretiens:[], notices:[], sorties:[], canWrite:true, ready:false,
  ui:{year:String(new Date().getFullYear()), bien:"", cat:"", nature:"", q:"", locYear:new Date().getFullYear(), showDone:false}};

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ds = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr = () => ds(new Date());
const fmtD = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "—";
const fmtDc = s => s ? `${s.slice(8,10)}/${s.slice(5,7)}<span class="yy">/${s.slice(0,4)}</span>` : "—";
const EUR = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const EUR0 = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur = n => EUR.format(n||0);
const eur0 = n => EUR0.format(Math.round(n||0));
const sum = arr => arr.reduce((a,o)=>a+(+o.montant||0),0);
const sg = o => (o.sens==="in"?1:-1)*(+o.montant||0);
const parseNum = s => { if(s===""||s==null) return null; const n=parseFloat(String(s).replace(/[\s ]/g,"").replace(",",".")); return isNaN(n)?null:n; };
function addMonths(s,n){ const [y,m,d]=s.split("-").map(Number); const dt=new Date(y,m-1+n,1); const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate(); dt.setDate(Math.min(d,last)); return ds(dt); }
function daysBetween(a,b){ return Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/86400000); }
function cfg(){
  const c = S.config||{};
  return {...DEFAULT_CONFIG,...c, indivisaires:Array.isArray(c.indivisaires)?c.indivisaires:[],
    biens:{locatif:{...DEFAULT_CONFIG.biens.locatif,...(c.biens?.locatif||{})}, secondaire:{...DEFAULT_CONFIG.biens.secondaire,...(c.biens?.secondaire||{})}}};
}
function bienLabel(b){ const c=cfg(); return b==="locatif"?c.biens.locatif.nom : b==="secondaire"?c.biens.secondaire.nom : "Commun"; }
function bienChip(b){ const k=b==="locatif"?"loc":b==="secondaire"?"sec":"com"; return `<span class="chip ${k}">${esc(bienLabel(b))}</span>`; }
const BIEN_OPTS = () => [{value:"commun",label:"Commun aux deux biens"},{value:"locatif",label:bienLabel("locatif")},{value:"secondaire",label:bienLabel("secondaire")}];
const sortedOps = () => [...S.ops].sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.createdAt||"").localeCompare(a.createdAt||""));
/* Réel = toujours compté. Prévu = compté seulement s'il est dans le futur (un prévu passé attend d'être validé). */
const eff = o => !o.prevision || (o.date||"") > todayStr();
const real = o => !o.prevision;
function soldeActuel(upTo){
  const c=cfg(), from=c.dateSoldeInitial||"", d=upTo||todayStr();
  return (+c.soldeInitial||0) + S.ops.filter(o=>o.date && o.date>=from && o.date<=d && eff(o)).reduce((a,o)=>a+sg(o),0);
}
function soldePrevu(d){
  const t=todayStr(); if(d<=t) return soldeActuel(d);
  return soldeActuel(t) + S.ops.filter(o=>o.prevision && o.date && o.date<=d && o.date>=(cfg().dateSoldeInitial||"")).reduce((a,o)=>a+sg(o),0);
}

/* ---------- Écritures ---------- */
function writeErr(e){
  const code=e&&e.code;
  if(code==="invalid_argument"){ S.canWrite=false; document.body.classList.add("readonly"); toast("Enregistrement refusé : il vous faut un accès Contributeur à cette page."); }
  else if(code==="quota_exceeded") toast("La base est pleine : supprimez d'anciennes entrées puis réessayez.");
  else toast("L'enregistrement a échoué. Vérifiez la connexion et réessayez.");
  console.warn(e);
}
async function save(coll,id,data){
  if(!S.db){ toast("Données indisponibles : vérifiez la connexion à la base."); return false; }
  try{ if(id) await S.db.collection(coll).doc(id).set(data); else await S.db.collection(coll).add(data); toast("Enregistré"); return true; }
  catch(e){ writeErr(e); return false; }
}
async function patch(coll,id,data){
  try{ await S.db.collection(coll).doc(id).update(data); return true; } catch(e){ writeErr(e); return false; }
}
async function remove(coll,id){
  try{ await S.db.collection(coll).doc(id).delete(); toast("Supprimé"); } catch(e){ writeErr(e); }
}
async function saveConfig(p){
  if(!S.db){ toast("Données indisponibles : vérifiez la connexion à la base."); return false; }
  const next={...cfg(),...p,updatedAt:new Date().toISOString()};
  try{ await S.db.doc("config/main").set(next); toast("Paramètres enregistrés"); return true; } catch(e){ writeErr(e); return false; }
}

/* ---------- Validation en un clic ---------- */
async function validerOps(list){
  if(!list.length) return; const ok=[];
  const fut=list.filter(o=>(o.date||"")>todayStr()); if(fut.length){ const d=fut.map(o=>o.date).sort()[0];
    if(!(await askConfirm("Valider en avance ?",`Cette opération est prévue le ${fmtD(d)}, dans ${daysBetween(todayStr(),d)} jour${daysBetween(todayStr(),d)>1?"s":""}. La valider maintenant la compte comme déjà passée sur le compte.`,"Valider quand même"))) return; }
  for(const o of list){ if(await patch("operations",o.id,{prevision:false,pointe:true,validee:true,updatedAt:new Date().toISOString()})) ok.push(o); else return; }
  const months=[...new Set(ok.filter(o=>o.bien==="locatif"&&!isHono(o)).map(o=>o.date.slice(0,7)))];
  if(months.length) setTimeout(()=>majHonoraires(months,true),400);
  const r=$("#toastRoot"); clearTimeout(toast._t);
  r.innerHTML=`<div class="toast" role="status">${ok.length>1?`${ok.length} opérations validées`:`« ${esc((ok[0].libelle||"").split(" – ")[0])} » validée`} <button class="sm" data-a="annuler-valid" data-ids="${esc(ok.map(o=>o.id).join(","))}" style="margin-left:10px;background:transparent;color:inherit;border-color:currentColor">Annuler</button></div>`;
  toast._t=setTimeout(()=>r.innerHTML="",6000);
}

/* ---------- Modales ---------- */
function optsHTML(options,v){
  return options.map(o=>{
    if(o && o.group) return `<optgroup label="${esc(o.group)}">${optsHTML(o.items,v)}</optgroup>`;
    const val=typeof o==="object"?o.value:o, lab=typeof o==="object"?o.label:o;
    return `<option value="${esc(val)}" ${String(val)===String(v??"")?"selected":""}>${esc(lab)}</option>`;
  }).join("");
}
function fieldHTML(f,v){
  const h=fieldHTML0(f,v); return f.show?h.replace(/^<div class="field/,`<div data-show="${esc(f.show)}" class="field`):h;
}
function fieldHTML0(f,v){
  const id="f_"+f.id, req=f.required?" required":"", half=f.half?" half":"";
  if(f.type==="html") return `<div class="field${half} f-html">${f.label?`<span class="f-lab">${esc(f.label)}</span>`:""}<div>${f.html}</div></div>`;
  if(f.type==="radio") return `<fieldset class="field f-radio${half}"><legend>${esc(f.label)}</legend><div class="seg">${f.options.map((o,i)=>`<label><input type="radio" name="${f.id}" id="${id}_${i}" value="${esc(o.value)}" ${String(o.value)===String(v)?"checked":""}><span>${esc(o.label)}</span></label>`).join("")}</div>${f.hint?`<small>${esc(f.hint)}</small>`:""}</fieldset>`;
  if(f.type==="months"){ const set=new Set((v||[]).map(Number)); return `<fieldset class="field f-months${half}"><legend>${esc(f.label)}</legend><div class="mchips">${MOIS_L.map((m,i)=>`<label><input type="checkbox" name="${f.id}" value="${i+1}" ${set.has(i+1)?"checked":""}><span>${esc(MOIS[i])}</span></label>`).join("")}</div>${f.hint?`<small>${esc(f.hint)}</small>`:""}</fieldset>`; }
  if(f.type==="checkbox") return `<div class="field check${half}"><input type="checkbox" id="${id}" name="${f.id}" ${v?"checked":""}><label for="${id}">${esc(f.label)}</label></div>`;
  const lab=`<label for="${id}">${esc(f.label)}${f.required?' <span class="req">*</span>':""}</label>`;
  let input;
  if(f.type==="select") input=`<select id="${id}" name="${f.id}"${req}>${optsHTML(f.options,v)}</select>`;
  else if(f.type==="textarea") input=`<textarea id="${id}" name="${f.id}" rows="${f.rows||4}" ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:""}>${esc(v??"")}</textarea>`;
  else { const t=f.type==="number"?"text":(f.type||"text");
    input=`<input id="${id}" name="${f.id}" type="${t}" ${f.type==="number"?'inputmode="decimal"':""} value="${esc(v??"")}"${req} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:""}>`; }
  return `<div class="field${half}">${lab}${input}${f.hint?`<small>${esc(f.hint)}</small>`:""}</div>`;
}
function closeModal(){ $("#modalRoot").innerHTML=""; }
function openForm({title,intro,fields,values={},submitLabel="Enregistrer",onSubmit}){
  const root=$("#modalRoot");
  root.innerHTML=`<div class="overlay" data-overlay><form class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" novalidate>
    <h2 id="mTitle">${esc(title)}</h2>${intro?`<div class="muted m-intro">${intro}</div>`:""}
    <div class="form-grid">${fields.map(f=>fieldHTML(f,values[f.id])).join("")}</div>
    <div class="form-err" id="formErr" role="alert"></div>
    <div class="modal-foot"><button type="button" data-close>Annuler</button><button type="submit" class="primary">${esc(submitLabel)}</button></div>
  </form></div>`;
  const form=root.querySelector("form");
  const t=form.querySelector("#mTitle"); if(t){ t.tabIndex=-1; t.focus({preventScroll:true}); }
  const syncShow=()=>form.querySelectorAll("[data-show]").forEach(w=>{ const [k,val]=w.dataset.show.split("="); const el=form.elements[k]; w.hidden=!(el&&el.value===val); });
  syncShow(); form.addEventListener("change",syncShow);
  form.addEventListener("submit",async ev=>{
    ev.preventDefault();
    const vals={};
    for(const f of fields){ if(f.type==="html") continue;
      if(f.type==="months"){ vals[f.id]=[...form.querySelectorAll(`input[name="${f.id}"]:checked`)].map(x=>+x.value); continue; }
      const el=form.elements[f.id]; if(!el) continue;
      if(f.type==="radio"){ vals[f.id]=el.value; continue; }
      const wrap=el.closest&&el.closest("[data-show]"); if(wrap&&wrap.hidden){ vals[f.id]=""; continue; }
      if(f.type==="checkbox") vals[f.id]=el.checked;
      else if(f.type==="number") vals[f.id]=parseNum(el.value);
      else vals[f.id]=el.value.trim();
      if(f.required && (vals[f.id]===""||vals[f.id]==null)){ $("#formErr").textContent=`Le champ « ${f.label} » est obligatoire.`; el.focus(); return; }
    }
    const btn=form.querySelector("button[type=submit]"); btn.disabled=true;
    const r=await onSubmit(vals);
    if(typeof r==="string"){ $("#formErr").textContent=r; btn.disabled=false; return; }
    if(r===false){ btn.disabled=false; return; }
    closeModal();
  });
}

function askConfirm(title,msg,yesLabel,danger){

    r.innerHTML=`<div class="overlay ov-top"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="acT"><h2 id="acT">${esc(title)}</h2><p style="margin:0">${msg}</p>
      <div class="modal-foot"><button type="button" id="acNo">Annuler</button><button type="button" class="primary ${danger?"danger-btn":""}" id="acYes">${esc(yesLabel)}</button></div></div></div>`;
    const done=v=>{ r.innerHTML=""; res(v); }; $("#acNo").onclick=()=>done(false); $("#acYes").onclick=()=>done(true);

/* ---------- Graphique ---------- */
function niceStep(r){ if(r<=0) return 1; const p=10**Math.floor(Math.log10(r)); const n=r/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
const fmtK = v => Math.abs(v)>=1000 ? (v/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+" k€" : Math.round(v)+" €";
function lineChart(pts){
  const W=640,H=220,pl=54,pr=70,pt=14,pb=26;
  const vals=pts.map(p=>p.v); let mn=Math.min(0,...vals), mx=Math.max(0,...vals); if(mx===mn) mx=mn+1000;
  const step=niceStep((mx-mn)/4); mn=Math.floor(mn/step)*step; mx=Math.ceil(mx/step)*step;
  const x=i=>pl+i*(W-pl-pr)/Math.max(1,pts.length-1), y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  let g=""; for(let t=mn;t<=mx+1e-6;t+=step){ g+=`<line class="${Math.abs(t)<1e-6&&mn<0?"zero":"grid"}" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${fmtK(t)}</text>`; }
  const base=y(Math.max(mn,Math.min(0,mx)));
  const seg=(a,b)=>{ let d=""; for(let i=a;i<=b;i++) d+=(i===a?"M":"L")+x(i).toFixed(1)+","+y(pts[i].v).toFixed(1); return d; };
  const area=(a,b,d)=>d+`L${x(b).toFixed(1)},${base}L${x(a).toFixed(1)},${base}Z`;
  let ri=pts.findIndex(p=>p.proj); if(ri<0) ri=pts.length; const lastReal=Math.max(0,ri-1), li=pts.length-1;
  const realD=seg(0,lastReal), projD=ri<pts.length?seg(lastReal,li):"";
  const every=pts.length>14?2:1;
  const labs=pts.map((p,i)=>i%every&&i!==lastReal?"":`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(p.l)}</text>`).join("");
  const nowLine=projD?`<line class="grid" x1="${x(lastReal)}" x2="${x(lastReal)}" y1="${pt}" y2="${H-pb}" stroke-dasharray="2 3"/><text x="${x(lastReal)+4}" y="${pt+10}">aujourd'hui</text>`:"";
  const lv=pts[lastReal].v, pv=pts[li].v;
  const hov=pts.map((p,i)=>({x:+(x(i)/W*100).toFixed(3),y:+(y(p.v)/H*100).toFixed(3),v:p.v,l:p.lf||p.l,p:!!p.proj}));
  return `<div class="chart-wrap" data-pts='${esc(JSON.stringify(hov))}'><div class="ch-line" hidden></div><div class="ch-dot" hidden></div><div class="ch-tip" hidden></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du solde du compte joint">${g}${nowLine}<path class="area" d="${area(0,lastReal,realD)}"/>${projD?`<path class="area proj" d="${area(lastReal,li,projD)}"/><path class="line proj" d="${projD}"/>`:""}<path class="line" d="${realD}"/>${labs}

function loyersMois(y){

    const amt=sum(lo.filter(real)), prev=sum(lo.filter(o=>o.prevision));
    const va=S.ops.filter(o=>(o.date||"").startsWith(key)&&inVersementAgence(o));
    const net=va.filter(real).reduce((a,o)=>a+sg(o),0), netPrev=va.filter(o=>o.prevision).reduce((a,o)=>a+sg(o),0);
    const detail=va.map(o=>`${(o.libelle||"").split(" – ")[0]} : ${o.sens==="in"?"+":"−"}${eur(+o.montant)}`).join("\n");
    const active=(!L.debutBail||key>=L.debutBail.slice(0,7))&&(!L.finBail||key<=L.finBail.slice(0,7));

const isHono=o=>o.bien==="locatif"&&o.sens==="out"&&/^honoraires de gestion/i.test(o.libelle||"");

function tauxTTC(){ const L=cfg().biens.locatif; const t=L.tauxHonoraires===undefined||L.tauxHonoraires===""?8:+L.tauxHonoraires; return t/100*1.2; }
function honoCalc(key){
  const ops=S.ops.filter(o=>o.bien==="locatif"&&(o.date||"").startsWith(key));
  const base=ops.filter(o=>o.sens==="in").reduce((a,o)=>a+(+o.montant||0),0)-ops.filter(isImpaye).reduce((a,o)=>a+(+o.montant||0),0);
  return {ops,base,montant:Math.max(0,Math.round(base*tauxTTC()*100)/100)};
}
async function majHonoraires(keys,silent){

async function shrinkImage(file,max=1800){
  try{ const bmp=await createImageBitmap(file); const r=Math.min(1,max/Math.max(bmp.width,bmp.height)); if(r===1&&file.size<1.5e6) return file;
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*r); c.height=Math.round(bmp.height*r); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",.85)); }catch(e){ return file; }
}

/* ---------- Régularisations de charges de copropriété ---------- */
const regulCovered=o=>!!(o.regul&&+o.montant===0);
const regulMois=()=>+cfg().regulMois||1;
const regulDebut=ex=>`${+ex+1}-${pad(regulMois())}-01`;
const isCoproCall=o=>o.categorie==="Charges de copropriété"&&/^pr[ée]l[èe]vement charges de copro/i.test(o.libelle||"");
const r2=n=>Math.round(n*100)/100;
function regulPlan(){
  const regs=[...(cfg().regulsCopro||[])].sort((a,b)=>(a.debut||"").localeCompare(b.debut||""));
  const calls=S.ops.filter(isCoproCall).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const base=o=>o.regul?+o.regul.base:+o.montant;
  const cur={}, parts={}, plan={};
  calls.forEach(o=>{ cur[o.id]=base(o); parts[o.id]={}; });
  // imputations déjà passées (opérations validées) : figées
  const fixed={};
  calls.filter(o=>!o.prevision&&o.regul&&o.regul.parts).forEach(o=>{ for(const [rid,d] of Object.entries(o.regul.parts)){ fixed[rid]=(fixed[rid]||0)+Math.abs(+d); (plan[rid]=plan[rid]||[]).push({id:o.id,date:o.date,d:+d,fixe:true}); } cur[o.id]=+o.montant; });
  for(const r of regs){
    const m=+r.montant||0; let rest=r2(m-(fixed[r.id]||0)); plan[r.id]=plan[r.id]||[];
    const cand=calls.filter(o=>o.prevision&&(o.date||"")>=(r.debut||""));
    if(r.sens==="trop"){ for(const o of cand){ if(rest<=0) break; const take=r2(Math.min(rest,cur[o.id])); if(take<=0) continue; cur[o.id]=r2(cur[o.id]-take); parts[o.id][r.id]=-take; rest=r2(rest-take); plan[r.id].push({id:o.id,date:o.date,d:-take}); } }
    else if(rest>0&&cand[0]){ const o=cand[0]; cur[o.id]=r2(cur[o.id]+rest); parts[o.id][r.id]=rest; plan[r.id].push({id:o.id,date:o.date,d:rest}); rest=0; }
    r._reste=Math.max(0,rest);
  }
  return {regs,calls,cur,parts,plan,base};
}
async function applyReguls(){
  const P=regulPlan(); let n=0; const W=[];
  for(const o of P.calls){ if(!o.prevision) continue;
    const b=P.base(o), m=P.cur[o.id], pr=P.parts[o.id], has=Object.keys(pr).length;
    if(has){ if(Math.abs(m-(+o.montant))>0.004||JSON.stringify(o.regul?.parts||{})!==JSON.stringify(pr)){ W.push(S.db.collection("operations").doc(o.id).update({montant:m,regul:{base:b,parts:pr}})); n++; } }
    else if(o.regul){ W.push(S.db.collection("operations").doc(o.id).update({montant:b,regul:null})); n++; }
  }
  await Promise.all(W); return n;
}

  const el=ev.target; if(!el.classList||!el.classList.contains("annuel-sel")||!el.value) return;
  const a=ANNUELS.find(x=>x.k===el.value); if(!a) return;
  const k=el.dataset.k, gdate=k.split("|")[1], cand=annuelCand(a,gdate);
  const last=[...S.ops].filter(o=>a.re.test(o.libelle||"")&&o.sens===a.sens).sort((p,q)=>q.date.localeCompare(p.date))[0];
  S.ui.inline={k,type:a.k,cand:cand?cand.id:null,from:cand?cand.date:null,montant:cand?cand.montant:(last?last.montant:"")};
  rerenderOps(); const i=$("#inlAmt"); if(i){ i.focus(); const L=i.value.length; i.setSelectionRange(L,L); }
});
async function inlineOk(){
  const inl=S.ui.inline; if(!inl) return; const a=ANNUELS.find(x=>x.k===inl.type);
  const n=parseNum($("#inlAmt").value); if(!(n>=0)){ toast("Indiquez un montant."); return; }
  const gdate=inl.k.split("|")[1], [y,m]=gdate.split("-"), it=S.ops.filter(o=>groupOf(o)&&(groupOf(o)+"|"+o.date)===inl.k), prev=it.some(o=>o.prevision);
  const lib=`${a.lib} – ${MOIS_L[+m-1]} ${y}`, now=new Date().toISOString(); let ok;
  if(inl.cand){ ok=await patch("operations",inl.cand,{date:gdate,libelle:lib,montant:Math.round(n*100)/100,categorie:a.cat,sens:a.sens,updatedAt:now}); }
  else { try{ await S.db.collection("operations").add({date:gdate,montant:Math.round(n*100)/100,categorie:a.cat,sens:a.sens,bien:"locatif",libelle:lib,indivisaire:"",pointe:!prev,prevision:prev,note:"",createdAt:now,updatedAt:now}); ok=true; }catch(e){ writeErr(e); } }
  if(!ok) return;
  S.ui.inline=null; rerenderOps(); toast(inl.cand?`${a.lib} déplacée sur ce versement`:`${a.lib} ajoutée`);
  setTimeout(()=>majHonoraires([gdate.slice(0,7),(inl.from||"").slice(0,7)],true),400);
}
document.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&ev.target.id==="inlAmt"){ ev.preventDefault(); inlineOk(); } if(ev.key==="Enter"&&ev.target.id==="popAmt"){ ev.preventDefault(); const b=document.querySelector("[data-a=pop-save]"); popSave(b.dataset.id,b.dataset.kind); } });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape" && $("#modalRoot").innerHTML) closeModal(); else if(ev.key==="Escape"&&S.ui.pop){ S.ui.pop=null; rerenderOps(); } });
function updQp(){ const t=[...document.querySelectorAll(".in-qp")].reduce((a,i)=>a+(parseNum(i.value)||0),0); const el=$("#qpTot"); if(el){ el.textContent=`Total : ${t.toLocaleString("fr-FR")} %`; el.className=Math.abs(t-100)<0.01?"":"neg"; } }
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="paramForm") return; ev.preventDefault();
  const rows=[...document.querySelectorAll(".indiv-row")].map(r=>({nom:r.querySelector(".in-nom").value.trim(),quotePart:parseNum(r.querySelector(".in-qp").value)||0})).filter(i=>i.nom);
  const err=$("#paramErr"); err.textContent="";
  const names=rows.map(r=>r.nom.toLowerCase()); if(new Set(names).size!==names.length){ err.textContent="Deux indivisaires portent le même nom."; return; }
  const tot=rows.reduce((a,i)=>a+i.quotePart,0); if(rows.length && Math.abs(tot-100)>0.01){ err.textContent=`Les quotes-parts totalisent ${tot.toLocaleString("fr-FR")} % au lieu de 100 %.`; return; }
  const c=cfg();
  const ok=await saveConfig({nom:$("#p_nom").value.trim()||DEFAULT_CONFIG.nom,indivisaires:rows,soldeInitial:parseNum($("#p_solde").value)||0,dateSoldeInitial:$("#p_date").value,
    biens:{locatif:{...c.biens.locatif,nom:$("#p_loc").value.trim()||"Bien locatif"},secondaire:{...c.biens.secondaire,nom:$("#p_sec").value.trim()||"Maison secondaire"}}});
  if(ok){ document.activeElement?.blur(); render(true); }
});
/* ---------- Import du tableur (fichier livré avec la page) ---------- */
let IMPORT=null;
async function loadImport(){ if(IMPORT!==null) return IMPORT; try{ const r=await fetch("import-tableur.json",{cache:"no-store"}); IMPORT=r.ok?await r.json():false; }catch{ IMPORT=false; } return IMPORT; }
async function showImportCard(){
  const z=$("#importZone"); if(!z) return;
  const d=await loadImport(); if(!d||!d.ops||!S.canWrite) return;
  const done=cfg().importTableur, ops=d.ops, nr=ops.filter(o=>!o.prevision).length, np=ops.length-nr;
  const dates=ops.map(o=>o.date).sort();
  z.style.display=""; z.innerHTML=`<div class="card"><div class="card-head"><h3>Import du tableur « ${esc(d.source)} »</h3>${done?`<span class="chip good">Importé le ${fmtD(done)}</span>`:""}</div>
    <p style="margin:0">${ops.length} opérations du ${fmtD(dates[0])} au ${fmtD(dates[dates.length-1])} : ${nr} réelles et ${np} prévues (projections). Les apports sont partagés à parts égales entre les deux indivisaires.${done?" Relancer l'import remet ces lignes à l'identique (sans doublon) : vos modifications sur elles seraient écrasées.":""}</p>
    <div id="impProg" class="progress" style="display:none"><div></div></div><small id="impMsg"></small>
    <div class="row"><button type="button" class="${done?"":"primary"} w" data-a="import-tableur">${done?"Réimporter":"Importer les "+ops.length+" opérations"}</button></div></div>`;
}
async function runImport(){
  const d=await loadImport(); if(!d||!S.db) return;
  const btn=document.querySelector('[data-a="import-tableur"]'); if(btn) btn.disabled=true;
  const prog=$("#impProg"), bar=prog.firstElementChild, msg=$("#impMsg"); prog.style.display="";
  S.importing=true; const now=new Date().toISOString(); let i=0;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  try{
    for(const o of d.ops){
      const {id,...data}=o; let tries=0; const mm=IMP_RE.exec(id); if(mm){ const nd=dayFor(mm[3],mm[1],mm[2]); if(nd) data.date=nd; }
      for(;;){ try{ await S.db.collection("operations").doc(id).set({...data,createdAt:now,updatedAt:now}); break; }
        catch(e){ if((e.code==="resource_exhausted"||e.code==="unavailable")&&tries<8){ tries++; msg.textContent="Pause pour respecter la limite d'écriture…"; await sleep(1500*tries); } else throw e; } }
      i++; if(i%10===0||i===d.ops.length){ bar.style.width=(i/d.ops.length*100).toFixed(1)+"%"; msg.textContent=`${i} / ${d.ops.length} opérations enregistrées`; }
    }
    S.importing=false;
    await saveConfig({importTableur:todayStr()});
    msg.textContent=`Import terminé : ${i} opérations.`; toast("Import terminé");
  }catch(e){ S.importing=false; msg.textContent=`Import interrompu après ${i} opérations. Relancez-le : il reprend sans doublon.`; writeErr(e); if(btn) btn.disabled=false; }
  render(true);
}

async function copyCsv(){
  const l=filteredOps(); const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const csv=["Date;Libellé;Catégorie;Sens;Bien;Indivisaire;Montant;Pointé;Prévu;Note",...l.map(o=>[o.date,q(o.libelle),q(o.categorie),o.sens==="in"?"Entrée":"Sortie",q(bienLabel(o.bien)),q(o.indivisaire),(sg(o)).toFixed(2).replace(".",","),o.pointe?"oui":"non",o.prevision?"oui":"non",q(o.note)].join(";"))].join("\n");
  try{ await navigator.clipboard.writeText(csv); toast(`${l.length} lignes copiées : collez-les dans un tableur.`); }
  catch{ openForm({title:"Export CSV",intro:"Sélectionnez tout le texte puis copiez-le.",fields:[{id:"csv",label:"Données",type:"textarea",rows:12}],values:{csv},submitLabel:"Fermer",onSubmit:async()=>true}); }
}

/* ---------- Démarrage ---------- */
render(true);
(async()=>{
  const C=window.claude;
  if(!window.GAS||!window.GAS.conf){ setStatus("Non connecté","warn"); S.ready=true; render(true); return openSetup(); }
  if(!C||!C.use){ setStatus("Aperçu hors ligne : les données ne sont pas enregistrées","bad"); S.ready=true; render(true); return; }
  const timer=setTimeout(()=>setStatus("Données injoignables pour l'instant","warn"),10000);
  const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
  if(!db){ clearTimeout(timer); setStatus("Connexion impossible","bad"); S.ready=true; render(true); return; }
  S.db=db;
  C.use("assets").then(a=>{ S.assets=a; if(S.ready) scheduleRender(); }).catch(()=>{});
  if(user){ try{ const w=await user.can("data.write"); if(w===false){ S.canWrite=false; document.body.classList.add("readonly"); } }catch{} }
  const pending=new Set(["config","operations","travaux","entretiens","notices","sorties"]);
  const arrived=(k,snap)=>{ if(!snap.metadata.fromCache){ pending.delete(k); if(!pending.size){ clearTimeout(timer); S.ready=true; setStatus("Synchronisé","good"); } } scheduleRender(); };
  const onErr=e=>{ clearTimeout(timer); S.ready=true; setStatus(e.code==="permission-denied"?"Clé refusée":e.code==="unavailable"?"Hors ligne":"Synchronisation interrompue","bad"); console.warn(e); if(e.code==="permission-denied") openSetup("La clé secrète a été refusée par le script."); };
  db.doc("config/main").onSnapshot(s=>{ S.config=s.exists?s.data():null; arrived("config",s); },onErr);
  [["operations","ops"],["travaux","travaux"],["entretiens","entretiens"],["notices","notices"],["sorties","sorties"]].forEach(([coll,key])=>{
    db.collection(coll).onSnapshot(s=>{ S[key]=s.docs.map(d=>({id:d.id,...d.data()})); arrived(coll,s); },onErr);
  });
  db.collection("journal").onSnapshot(s=>{ S.journal=s.docs.map(d=>({id:d.id,...d.data()})); if(route()==="parametres") scheduleRender(); },()=>{});
})();
</script>
